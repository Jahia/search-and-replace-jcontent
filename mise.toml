# Toolchain of the module. JDK 17: frontend-maven-plugin 2.0.1 is compiled for 17 (the classes still
# target 11, set by the 8.2 parent). Maven 3.8: under 3.9 the jahia-maven-plugin dependency scan
# writes a wrong Import-Package while the build stays green.
[tools]
java = "temurin-17"
maven = "3.8.8"
node = "22.21.0"
